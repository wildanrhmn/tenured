[workspace]
resolver = "2"
members = ["rules", "verifier", "lane", "integration"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
track-record-rules = { path = "rules" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
