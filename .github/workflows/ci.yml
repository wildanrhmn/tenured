name: ci

on:
  push:
  pull_request:

jobs:
  offchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck -w offchain
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck -w web
      - run: npm test -w web
      - run: npm run build -w web

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Unit tests
        working-directory: contracts
        run: cargo test -p tenured-rules -p tenured-verifier -p tenured-lane
      - name: Build contracts
        run: ./scripts/build-contracts.sh
      - name: Sandbox tests (real sputnikdao2 code)
        working-directory: contracts
        run: cargo test -p tenured-integration -- --test-threads=2
